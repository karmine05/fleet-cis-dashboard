events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # The dashboard pulls ~1.5 MB of JSON per load (/api/safeguard-compliance
    # alone is ~816 KB raw, ~166 KB gzipped: -80%). Compressing at the edge is
    # far cheaper than shipping that over the wire.
    gzip on;
    # Level 6 is the point where the JSON payloads stop compressing meaningfully
    # better while CPU cost keeps climbing; 9 buys ~1-2% for noticeably more work.
    gzip_comp_level 6;
    # Below ~1 KB the gzip header plus the CPU round trip can make the response
    # bigger, and it never fills fewer packets, so small API replies stay plain.
    gzip_min_length 1024;
    # Only the types actually served here: the JSON API plus the four static
    # assets in frontend/ (app.js, styles.css, logo.svg, favicon.svg).
    # .js maps to application/javascript on older nginx and text/javascript on
    # 1.21.5+, so both are listed. text/html is deliberately absent: nginx always
    # gzips it and listing it emits a "duplicate MIME type" warning.
    gzip_types
        application/json
        application/javascript
        text/javascript
        text/css
        image/svg+xml;
    # Responses reach the browser through this proxy layer, so compress even when
    # the request arrives with proxy-related headers, and advertise
    # "Vary: Accept-Encoding" so caches never hand a gzipped body to a client
    # that cannot decode it.
    gzip_proxied any;
    gzip_vary on;

    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # Re-resolve the backend hostname through Docker's embedded DNS
            # instead of caching its IP at startup. A literal hostname in
            # proxy_pass is resolved once, so recreating the backend container
            # leaves nginx proxying to a dead IP (502 Bad Gateway) until nginx
            # itself is restarted. Using a variable forces per-request lookup.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend_upstream http://backend:5001;
            proxy_pass $backend_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
